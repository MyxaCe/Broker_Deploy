name: broker-local

services:
  site-db:
    volumes:
      - site-db-data:/var/lib/postgresql/data
      - ../../site-platform/db/init:/docker-entrypoint-initdb.d:ro

  mds:
    build:
      context: ../../mds
    ports: !override
      - '3103:3003'
    environment:
      QUOTE_STALE_AFTER_MS: ${QUOTE_STALE_AFTER_MS}

  cms-migrate:
    build:
      context: ../../cms-legacy
      target: build
    command:
      - sh
      - -c
      - pnpm payload migrate && NODE_ENV=production DEFAULT_SITE=apex-ru pnpm seed

  cms:
    build:
      context: ../../cms-legacy
    ports: !override
      - '3101:3001'
    environment:
      CMS_PUBLIC_URL: http://${VPS_HOST}:3101
      SITE_URL: http://${VPS_HOST}:3100

  web:
    build:
      context: ../../site-platform
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_WS_URL: http://${VPS_HOST}:3103
        NEXT_PUBLIC_CABINET_URL: http://${VPS_HOST}:3102
        FRAME_ANCESTORS: "'self' http://${VPS_HOST}:3101"
    ports: !override
      - '3100:3000'
    environment:
      NEXT_PUBLIC_WS_URL: http://${VPS_HOST}:3103
      NEXT_PUBLIC_SITE_URL: http://${VPS_HOST}:3100

  cabinet:
    build:
      context: ../../site-platform
      dockerfile: docker/cabinet.Dockerfile
      args:
        NEXT_PUBLIC_WS_URL: http://${VPS_HOST}:3103
    ports: !override
      - '3102:3002'
    environment:
      NEXT_PUBLIC_WS_URL: http://${VPS_HOST}:3103
      NEXT_PUBLIC_SITE_URL: http://${VPS_HOST}:3100

  relay:
    build:
      context: ../../site-platform
      dockerfile: docker/relay.Dockerfile
    depends_on:
      site-db:
        condition: service_healthy
      bus:
        condition: service_healthy

  consumer:
    build:
      context: ../../site-platform
      dockerfile: docker/consumer.Dockerfile
    environment:
      BUS_URL: ${CABINET_BUS_URL}
    depends_on:
      site-db:
        condition: service_healthy
      bus:
        condition: service_healthy

  bus:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: site-web
      RABBITMQ_DEFAULT_PASS: ${BUS_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: platform
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - bus-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_running']
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

volumes:
  bus-data:
