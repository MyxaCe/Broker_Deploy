name: Смоук против живой биржи

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: smoke-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Поднять MDS против настоящего Binance
        run: |
          set -euo pipefail
          QUOTE_STALE_AFTER_MS=60000 \
          MDS_ADMIN_TOKEN=${{ secrets.MDS_ADMIN_TOKEN || 'ci-token-не-короче-24-символов' }} \
          PORT=3003 \
          node dist/index.js & echo $! > /tmp/mds.pid
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3003/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3003/health | head -c 2000; echo

      - name: Смоук — живая половина
        env:
          MDS_URL: http://127.0.0.1:3003
          MDS_SMOKE_MODE: live
          MDS_ADMIN_TOKEN: ${{ secrets.MDS_ADMIN_TOKEN || 'ci-token-не-короче-24-символов' }}
        run: node scripts/smoke.mjs

      - name: Снять поднятое
        if: always()
        run: |
          [ -f /tmp/mds.pid ] && kill "$(cat /tmp/mds.pid)" 2>/dev/null || true
          wait 2>/dev/null || true
