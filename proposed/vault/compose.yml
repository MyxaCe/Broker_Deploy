name: broker-vault

services:
  openbao:
    image: openbao/openbao@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
    container_name: broker-vault
    restart: unless-stopped
    command: ["server"]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    volumes:
      - vault-data:/openbao/data
      - ./config.hcl:/openbao/config/config.hcl:ro
    networks:
      - back
    healthcheck:
      test: ["CMD-SHELL", "bao status -address=http://127.0.0.1:8200 >/dev/null 2>&1 || [ $? -eq 2 ]"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  back:
    external: true
    name: broker-back

volumes:
  vault-data:
