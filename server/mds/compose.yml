# Сервер котировок (MDS) · OPS-28.
#
# ОБРАЗ ТОЛЬКО ИЗ РЕЕСТРА. ПОРТОВ НАРУЖУ НЕТ И ИМЕНИ В ПРОКСИ НЕТ:
# служба внутренняя, витрина, кабинет и CMS ходят к ней по `broker-back`.
#
# СОСТОЯНИЯ У НЕЁ НЕТ — БАЗЫ ТОЖЕ. MDS stateless по построению: он
# мультиплексирует поток провайдера, а не хранит его. Поэтому в снимке
# бэкапа базы MDS не будет, и это не пропуск: искать её там — значит
# искать то, чего нет.
#
# ЧЕГО ЗДЕСЬ НАМЕРЕННО НЕТ:
#   TWELVEDATA_API_KEY — ключа нет. Пусто → вселенная только Binance, то
#     есть крипта. Это не урезание: бесплатные источники форекса и металлов
#     запрещают показ данных конечным пользователям, и упирается это в
#     письмо от поставщика, а не в нашу работу (Р-075).
#   MDS_ADMIN_TOKEN — не задан, и ручка смены источника цены выключена
#     целиком (503). Умолчания у него нет и быть не может: умолчание здесь
#     — это открытая ручка подмены цены. Реестр меняется правкой файла на
#     томе; завести токен — отдельное решение штаба.
#
#     КОГДА БУДЕТЕ ЗАВОДИТЬ — требования к значению, и они проверяются:
#     только ASCII без пробелов, НЕ КОРОЧЕ 24 СИМВОЛОВ. Нарушение любого
#     из двух выключает ручку ЦЕЛИКОМ и отвечает 503 с
#     `control-plane-disabled`, а не 401. То есть короткий или
#     кириллический токен выглядит как «ручка не работает», а не как
#     «секрет не тот», и чинить по этому признаку пойдут не туда.
#     Проверено живым прогоном: зона развёртывания наткнулась на это
#     первым же токеном 25.10.

name: broker-mds

services:
  mds:
    image: ghcr.io/myxace/broker-mds:${MDS_REVISION}
    container_name: broker-mds
    restart: unless-stopped
    environment:
      PORT: '3003'
      BATCH_MS: '250'
      BINANCE_WS_URL: wss://stream.binance.com:9443
      # ПОРОГ СВЕЖЕСТИ. Умолчания у него нет сознательно (КОНТРАКТЫ §5г):
      # не задан — котировки не отдаются вовсе, /health 503. Значение 60000
      # взято из `.env.example` самого MDS, то есть это утверждение
      # источника о себе, а не придуманное нами число. Потребитель свой
      # порог не выдумывает: он приходит снаружи или не применяется.
      QUOTE_STALE_AFTER_MS: '60000'
      # Период пересчёта маршрутизации: через него замечается тишина
      # источника и происходит переход на запасного.
      MDS_ROUTING_RECHECK_MS: '5000'
      # Реестр провайдеров ОБЯЗАН лежать на томе. На диске контейнера он
      # пережил бы ровно до следующей выкатки, и переключатель источника в
      # админке работал бы «до первого деплоя» — предупреждение стоит в
      # `.env.example` самого MDS.
      MDS_REGISTRY_PATH: /app/data/providers.json
    volumes:
      - registry:/app/data
    healthcheck:
      # Спрашиваем саму службу, а не процесс. `/health` у MDS отвечает 503,
      # когда порог свежести не задан, — то есть проверка краснеет ровно на
      # той настройке, без которой котировок не будет.
      test:
        - CMD-SHELL
        - 'wget -qO- http://127.0.0.1:3003/health >/dev/null 2>&1 || exit 1'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # `back` — к MDS ходят витрина, кабинет и CMS изнутри.
    # `edge` добавлена OPS-29: публичные ручки котировок проксирует
    # Caddy, а он живёт в `edge`. Без неё правило в Caddyfile
    # совпадает, но отдаёт 502 — наблюдено, а не предположено.
    networks: [back, edge]

networks:
  back:
    external: true
    name: broker-back
  edge:
    external: true
    name: broker-edge

volumes:
  registry:
