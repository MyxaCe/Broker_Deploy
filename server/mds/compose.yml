name: broker-mds

services:
  mds:
    image: ghcr.io/myxace/broker-mds:${MDS_REVISION}
    container_name: broker-mds
    restart: unless-stopped
    environment:
      PORT: '3003'
      BATCH_MS: '250'
      BINANCE_WS_URL: ${MARKET_WS_URL:-wss://stream.binance.com:9443}
      BINANCE_API_URL: ${MARKET_API_URL:-https://api.binance.com}
      QUOTE_STALE_AFTER_MS: '60000'
      MDS_ROUTING_RECHECK_MS: '5000'
      MDS_REGISTRY_PATH: /app/data/providers.json
      CMS_API_URL: http://broker-cms:3001/v1
      CMS_API_KEY: ${CMS_API_KEY}
      CMS_WEBHOOK_SECRET: ${CMS_WEBHOOK_SECRET}
      MARKET_V2_API_URL: ${MARKET_V2_API_URL}
    volumes:
      - registry:/app/data
    depends_on:
      registry-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -qO- http://127.0.0.1:3003/health >/dev/null 2>&1 || exit 1'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [back, edge]

  registry-init:
    image: ghcr.io/myxace/broker-mds:${MDS_REVISION}
    container_name: broker-mds-registry-init
    user: root
    entrypoint: ['chown', 'app:app', '/app/data']
    volumes:
      - registry:/app/data
    network_mode: none
    restart: 'no'

networks:
  back:
    external: true
    name: broker-back
  edge:
    external: true
    name: broker-edge

volumes:
  registry:
