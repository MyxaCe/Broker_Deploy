services:
  caddy:
    image: caddy:2.10-alpine
    container_name: broker-proxy
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMAIN: ${DOMAIN}
      ADMIN_IP: ${ADMIN_IP}
    networks:
      - default
      - edge
networks:
  edge:
    external: true
    name: broker-edge
volumes:
  caddy-data:
  caddy-config:
