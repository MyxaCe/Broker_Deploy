name: broker-cms

services:
  db:
    image: postgres:16-alpine
    container_name: broker-db-cms
    restart: unless-stopped
    environment:
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: ${CMS_DB_PASSWORD}
      POSTGRES_DB: broker_cms
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cms -d broker_cms']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [inside]

  migrate:
    image: ghcr.io/myxace/broker-cms-migrate:${CMS_REVISION}
    container_name: broker-cms-migrate
    restart: 'no'
    command:
      - sh
      - -c
      - pnpm payload migrate && NODE_ENV=production DEFAULT_SITE=apex-ru pnpm seed
    environment:
      DATABASE_URL: postgres://cms:${CMS_DB_PASSWORD}@db:5432/broker_cms
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      DEFAULT_SITE: apex-ru
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_EDITOR_EMAIL: ${SEED_EDITOR_EMAIL}
      SEED_EDITOR_PASSWORD: ${SEED_EDITOR_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks: [inside]

  cms:
    image: ghcr.io/myxace/broker-cms:${CMS_REVISION}
    container_name: broker-cms
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://cms:${CMS_DB_PASSWORD}@db:5432/broker_cms
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      CMS_API_KEY: ${CMS_API_KEY}
      DEFAULT_SITE: apex-ru
      CMS_PUBLIC_URL: https://cms.${DOMAIN}
      SITE_URL: https://${DOMAIN}
      SITE_WEBHOOK_URL: http://broker-web:3000/api/revalidate
      SITE_WEBHOOK_SECRET: ${CMS_WEBHOOK_SECRET}
      PLATFORM_INSTRUMENTS_WEBHOOK_URLS: ${PLATFORM_INSTRUMENTS_WEBHOOK_URLS}
      PLATFORM_INSTRUMENTS_WEBHOOK_SECRET: ${PLATFORM_INSTRUMENTS_WEBHOOK_SECRET}
      SITE_PREVIEW_SECRET: ${PREVIEW_SECRET}
      MDS_HTTP_URL: http://broker-mds:3003
      TERMINAL_INTERNAL_URL: http://broker-terminal-gateway:8080
      TERMINAL_INTERNAL_TOKEN: ${INTERNAL_MONEY_TOKEN}
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [inside, edge, back]

networks:
  inside:
    driver: bridge
  edge:
    external: true
    name: broker-edge
  back:
    external: true
    name: broker-back

volumes:
  db-data:
  media:
