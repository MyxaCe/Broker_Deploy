name: broker-site

services:
  db:
    image: postgres:16-alpine
    container_name: broker-db-site
    restart: unless-stopped
    environment:
      POSTGRES_DB: broker_site
      POSTGRES_USER: broker
      POSTGRES_PASSWORD: ${SITE_DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U broker -d broker_site']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [inside]

  web:
    image: ghcr.io/myxace/broker-web:${SITE_REVISION}
    container_name: broker-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
      NEXT_PUBLIC_CABINET_URL: https://cabinet.${DOMAIN}
      CALENDAR_API_URL: ${CALENDAR_API_URL}
      NEXT_PUBLIC_TERMINAL_URL: https://terminal.${DOMAIN}
      NEXT_PUBLIC_WS_URL: https://${DOMAIN}
      DATABASE_URL: postgres://broker:${SITE_DB_PASSWORD}@db:5432/broker_site
      SITE_SLUG: apex-ru
      CMS_WEBHOOK_SECRET: ${CMS_WEBHOOK_SECRET}
      PREVIEW_SECRET: ${PREVIEW_SECRET}
      CMS_API_URL: http://broker-cms:3001/v1
      CMS_API_KEY: ${CMS_API_KEY}
      MDS_HTTP_URL: http://broker-mds:3003
      STATUS_PROMETHEUS_URL: ${STATUS_PROMETHEUS_URL-http://broker-prometheus:9090}
      ATTRIBUTION_COOKIE_DOMAIN: .${DOMAIN}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - web-next-cache:/app/apps/web/.next/cache
    networks: [inside, edge, back]

  cabinet:
    image: ghcr.io/myxace/broker-cabinet:${SITE_REVISION}
    container_name: broker-cabinet
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
      NEXT_PUBLIC_CABINET_URL: https://cabinet.${DOMAIN}
      NEXT_PUBLIC_TERMINAL_URL: https://terminal.${DOMAIN}
      NEXT_PUBLIC_WS_URL: https://${DOMAIN}
      DATABASE_URL: postgres://broker:${SITE_DB_PASSWORD}@db:5432/broker_site
      SITE_SLUG: apex-ru
      TERMINAL_INTERNAL_URL: http://broker-terminal-gateway:8080
      INTERNAL_MONEY_TOKEN: ${INTERNAL_MONEY_TOKEN}
      EXCHANGE_TRON_ADDRESS: ${EXCHANGE_TRON_ADDRESS}
      CABINET_PUBLIC_URL: https://cabinet.${DOMAIN}
      TERMINAL_ORIGINS: https://terminal.${DOMAIN}
      TERMINAL_TOP_LEVEL: "0"
      ATTRIBUTION_COOKIE_DOMAIN: .${DOMAIN}
      UPLOAD_DIR: /app/uploads
      MDS_HTTP_URL: http://broker-mds:3003
      CMS_API_URL: http://broker-cms:3001/v1
      CMS_API_KEY: ${CMS_API_KEY}
      TERMINAL_HTTP_URL: http://broker-terminal-web
      SSO_PRIVATE_KEY_B64: ${SSO_PRIVATE_KEY_B64}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET}
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - cabinet-uploads:/app/uploads
    networks: [inside, edge, back]

  relay:
    image: ghcr.io/myxace/broker-relay:${SITE_REVISION}
    container_name: broker-relay
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://broker:${SITE_DB_PASSWORD}@db:5432/broker_site
      BUS_URL: amqp://site-web:${BUS_SITE_WEB_PASSWORD}@broker-bus:5672/platform
      BUS_EXCHANGE: platform.events
    depends_on:
      db:
        condition: service_healthy
    networks: [inside, back]

  consumer:
    image: ghcr.io/myxace/broker-consumer:${SITE_REVISION}
    container_name: broker-consumer
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://broker:${SITE_DB_PASSWORD}@db:5432/broker_site
      SITE_SLUG: apex-ru
      BUS_URL: amqp://cabinet:${BUS_CABINET_PASSWORD}@broker-bus:5672/platform
      BUS_EXCHANGE: platform.events
    depends_on:
      db:
        condition: service_healthy
    networks: [inside, back]

  admin:
    image: ghcr.io/myxace/broker-admin:${SITE_REVISION}
    container_name: broker-admin
    restart: unless-stopped
    environment:
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
      S3_ENDPOINT: https://files.<домен>
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET}
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      DATABASE_URL: postgres://broker:${SITE_DB_PASSWORD}@db:5432/broker_site
      TERMINAL_INTERNAL_URL: http://broker-terminal-gateway:8080
      INTERNAL_MONEY_TOKEN: ${INTERNAL_MONEY_TOKEN}
      MONEY_SIGNING_KEY_PEM_B64: ${MONEY_SIGNING_KEY_PEM_B64}
      MONEY_BOOTSTRAP_MODE: ${MONEY_BOOTSTRAP_MODE}
      EXCHANGE_TRON_ADDRESS: ${EXCHANGE_TRON_ADDRESS}
      SITE_SLUG: apex-ru
      CABINET_PUBLIC_URL: https://cabinet.${DOMAIN}
      PLATFORM_TRANSFER_SIGNING_KEY_PEM_B64: ${PLATFORM_TRANSFER_SIGNING_KEY_PEM_B64}
    depends_on:
      db:
        condition: service_healthy
    networks: [inside, edge, back]

  chain-watcher:
    image: ghcr.io/myxace/broker-chain-watcher:${SITE_REVISION}
    container_name: broker-chain-watcher
    restart: unless-stopped
    profiles: [chain]
    environment:
      DATABASE_URL: postgres://broker:${SITE_DB_PASSWORD}@db:5432/broker_site
      SITE_SLUG: apex-ru
      EXCHANGE_TRON_ADDRESS: ${EXCHANGE_TRON_ADDRESS}
      TERMINAL_INTERNAL_URL: http://broker-terminal-gateway:8080
      INTERNAL_MONEY_TOKEN: ${INTERNAL_MONEY_TOKEN}
      TRONGRID_API_KEY: ${TRONGRID_API_KEY}
      POLL_INTERVAL_MS: "15000"
    depends_on:
      db:
        condition: service_healthy
    networks: [inside, back]

  support-mail:
    image: ghcr.io/myxace/broker-support-mail:${SITE_REVISION}
    container_name: broker-support-mail
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://broker:${SITE_DB_PASSWORD}@db:5432/broker_site
      SITE_SLUG: apex-ru
      SUPPORT_MAIL_ADDRESS: ${SUPPORT_MAIL_ADDRESS}
      SUPPORT_SMTP_HOST: ${SUPPORT_SMTP_HOST}
      SUPPORT_SMTP_PORT: ${SUPPORT_SMTP_PORT}
      SUPPORT_SMTP_USER: ${SUPPORT_SMTP_USER}
      SUPPORT_SMTP_PASSWORD: ${SUPPORT_SMTP_PASSWORD}
      SUPPORT_IMAP_HOST: ${SUPPORT_IMAP_HOST}
      SUPPORT_IMAP_PORT: ${SUPPORT_IMAP_PORT}
      SUPPORT_IMAP_USER: ${SUPPORT_IMAP_USER}
      SUPPORT_IMAP_PASSWORD: ${SUPPORT_IMAP_PASSWORD}
      SUPPORT_SEND_PER_HOUR: ${SUPPORT_SEND_PER_HOUR}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET}
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks: [inside]

  minio:
    image: bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
    container_name: broker-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET}
      MINIO_SCHEME: http
    volumes:
      - minio-data:/bitnami/minio/data
    networks: [inside, edge]

networks:
  inside:
    driver: bridge
  edge:
    external: true
    name: broker-edge
  back:
    external: true
    name: broker-back

volumes:
  web-next-cache:
  db-data:
  cabinet-uploads:
  minio-data:
