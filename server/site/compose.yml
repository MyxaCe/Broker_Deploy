# Витрина и кабинет · OPS-25, этап 2 (продолжение).
#
# ОБРАЗЫ ТОЛЬКО ИЗ РЕЕСТРА, ПО ХЕШУ КОММИТА. Ни одного `build:`.
# ПОРТОВ НАРУЖУ НЕТ. Наружу выходит только прокси.
#
# ДОМЕН ЗДЕСЬ НЕ НАПИСАН И НЕ ДОЛЖЕН ПОЯВИТЬСЯ. `${DOMAIN}` приходит из
# `/srv/broker/proxy/.env` — там он объявлен один раз, — и компоуз читает
# ОБА файла сразу. Поэтому стек поднимается через `./compose.sh`, а не
# голым `docker compose`: ключи `--env-file` и есть тот механизм, который
# держит домен в одном месте. Запустишь без обёртки — получишь
# `https://.` и поймёшь это не сразу.
#
# ОБРАЗ НЕ ЗНАЕТ ДОМЕНА (Р-220): адреса подставляются в собранный вывод при
# старте, скриптом `runtime-config.sh` внутри образа. Незаданный
# обязательный адрес — ОТКАЗ СТАРТА с именем переменной, а не умолчание.
# Это то, ради чего ждали WEB-22, и проверять это надо отказом, а не чтением.

name: broker-site

services:
  db:
    image: postgres:16-alpine
    # Имя под фильтр бэкапа (`grep -E 'postgres|-db-'` ПО ИМЕНИ контейнера).
    # `broker-site-db` под него не попал бы, и база молча не попала бы в снимок.
    container_name: broker-db-site
    restart: unless-stopped
    environment:
      POSTGRES_DB: broker_site
      POSTGRES_USER: broker
      POSTGRES_PASSWORD: ${SITE_DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      # Схема приезжает файлами из `Sait_Platform/db/init`, скопированными
      # сюда. Это ВТОРАЯ копия схемы, и она названа долгом в README: initdb
      # выполняет их ровно один раз, на пустом томе.
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U broker -d broker_site']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [inside]

  web:
    image: ghcr.io/myxace/broker-web:${SITE_REVISION}
    container_name: broker-web
    restart: unless-stopped
    environment:
      # --- Публичные адреса: подставляются в сборку при старте -------------
      NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
      NEXT_PUBLIC_CABINET_URL: https://cabinet.${DOMAIN}
      NEXT_PUBLIC_TERMINAL_URL: https://terminal.${DOMAIN}
      # ПУСТО, И ТЕПЕРЬ ЭТО ЗНАЧИТ ДРУГОЕ, ЧЕМ ДО OPS-28.
      # Это адрес MDS ДЛЯ БРАУЗЕРА (socket.io и иконки), а MDS по решению
      # штаба наружу не выставлен и имени в прокси не имеет. Значит живой
      # поток до браузера не доходит, и служба подставляет мок — но
      # ОБЪЯВЛЯЯ его: подлинность решается наличием адреса источника, и
      # статус принудительно становится `simulated` (КОНТРАКТЫ §5г).
      # Серверная сторона при этом настоящая: каталог и состояние
      # котировок берутся по MDS_HTTP_URL ниже.
      NEXT_PUBLIC_WS_URL: ''
      # --- Серверная сторона ------------------------------------------------
      DATABASE_URL: postgres://broker:${SITE_DB_PASSWORD}@db:5432/broker_site
      SITE_SLUG: apex-ru
      CMS_WEBHOOK_SECRET: ${CMS_WEBHOOK_SECRET}
      PREVIEW_SECRET: ${PREVIEW_SECRET}
      # CMS развёрнута с 23.10 (OPS-27). Адрес СЕРВЕРНЫЙ, контейнер в
      # контейнер: публичное имя увело бы запрос наружу и обратно через
      # прокси, а админка там ещё и закрыта по источнику — витрина
      # получала бы 403 и считала CMS сломанной.
      CMS_API_URL: http://broker-cms:3001/v1
      CMS_API_KEY: ${CMS_API_KEY}
      # Каталог и состояние котировок — СЕРВЕРНОЙ стороной (OPS-28).
      MDS_HTTP_URL: http://broker-mds:3003
    depends_on:
      db:
        condition: service_healthy
    # `back` добавлена OPS-27: по ней витрина ходит в CMS. `edge` — путь
    # снаружи внутрь, трафику между приложениями там не место.
    networks: [inside, edge, back]

  cabinet:
    image: ghcr.io/myxace/broker-cabinet:${SITE_REVISION}
    container_name: broker-cabinet
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
      NEXT_PUBLIC_CABINET_URL: https://cabinet.${DOMAIN}
      NEXT_PUBLIC_TERMINAL_URL: https://terminal.${DOMAIN}
      NEXT_PUBLIC_WS_URL: ''
      DATABASE_URL: postgres://broker:${SITE_DB_PASSWORD}@db:5432/broker_site
      SITE_SLUG: apex-ru
      UPLOAD_DIR: /app/uploads
      MDS_HTTP_URL: http://broker-mds:3003
      CMS_API_URL: http://broker-cms:3001/v1
      CMS_API_KEY: ${CMS_API_KEY}
      # Адрес терминала ДЛЯ ПРОЦЕССА, не для браузера (CAB-09). История
      # сделок читается кабинетом из контейнера, и публичное имя увело бы
      # запрос наружу и обратно через прокси. Пара та же, что у MDS:
      # NEXT_PUBLIC_* браузеру, обычная переменная процессу.
      TERMINAL_HTTP_URL: http://broker-terminal-web
      # Ключ подписи handoff-JWT. Без него /api/sso/jwks отдаёт 503
      # sso_not_configured — честный отказ. Сгенерирован на машине,
      # в репозитории его нет и быть не может.
      SSO_PRIVATE_KEY_B64: ${SSO_PRIVATE_KEY_B64}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - cabinet-uploads:/app/uploads
    networks: [inside, edge, back]

networks:
  inside:
    driver: bridge
  edge:
    external: true
    name: broker-edge
  back:
    # Кабинету нужна `back`, чтобы дотянуться до терминала по имени.
    # Через `edge` это тоже вышло бы, но `edge` — путь снаружи внутрь,
    # и трафик между приложениями ей не место.
    external: true
    name: broker-back

volumes:
  db-data:
  cabinet-uploads:
