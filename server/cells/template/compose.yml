# Ячейка платформы · шаблон (вариант B проекта «вторая платформа»).
#
# ОДНА ЯЧЕЙКА = ОДНА ПЛАТФОРМА: витрина, кабинет, админка, релей, консюмер,
# наблюдатель TRON, своя база сайта, своё хранилище KYC (MinIO), свой
# терминал со своей базой и денежным журналом. Общий у ячеек только ХАБ:
# прокси, CMS, MDS, шина, мониторинг.
#
# ЗАПУСКАТЬ ТОЛЬКО ЧЕРЕЗ `cell.sh <slug> …`. Обёртка подставляет имя проекта
# (`broker-cell-<slug>`), три env-файла (общие ключи хаба, параметры ячейки,
# секреты ячейки) и ревизии образов из файлов ячейки. Голый `docker compose`
# соберёт адреса вида `https://` и имена вида `broker-web-` — и это
# недопустимо, поэтому почти каждая переменная ниже записана как `${X:?…}`:
# пустое значение = отказ compose ДО старта, а не тихо кривой контейнер.
#
# ПОЧЕМУ ИМЕНА СЕРВИСОВ НАЧИНАЮТСЯ С `cell-` И ПОЧЕМУ ВНУТРИ ВСЕ АДРЕСА —
# ПОЛНЫЕ ИМЕНА КОНТЕЙНЕРОВ. Compose вешает имя сервиса алиасом на КАЖДУЮ
# сеть сервиса, включая общие `broker-edge` и `broker-back`. На стенде там
# уже живут алиасы Apex: `minio` (edge), `gateway` (back), `web`, `cabinet`…
# Назови сервис ячейки `minio` — и кабинет Apex, который ходит в `minio:9000`,
# начнёт по round-robin DNS попадать в KYC-хранилище ЧУЖОЙ платформы.
# Поэтому:
#   * имена сервисов ячейки — `cell-*` (их не резолвит никто);
#   * всё, что ячейка зовёт сама, — по имени контейнера `broker-*-<slug>`,
#     оно уникально на хосте;
#   * единственное короткое имя, которое нельзя поменять, — `gateway:8080`,
#     оно зашито в nginx образа терминала. Алиас `gateway` выдан шлюзу ТОЛЬКО
#     во внутренней сети ячейки, а сам `cell-term-web` в общую `back`
#     (где алиас `gateway` есть у шлюза Apex) НЕ подключён.
#
# ОБРАЗЫ ТОЛЬКО ИЗ РЕЕСТРА, ПО ПОЛНОМУ ХЕШУ КОММИТА (`.revision` ячейки).
# ПОРТОВ НАРУЖУ НЕТ. Наружу выходит только прокси хаба.
#
# Отличия от стека Apex (`site/compose.yml` + `terminal/compose.yml`) —
# только параметризация; поведение приложений то же:
#   * адреса — четыре явных имени (+ files), а не `cabinet.${DOMAIN}`;
#   * шина — СВОЙ vhost ячейки и свои кредлы (события чужой платформы сюда
#     не доходят физически, см. lib/bus.sh);
#   * `db-init/` Apex НЕ подключён: пустая база ячейки получает схему
#     миграциями (тот же путь, что при каждом деплое витрины);
#   * chain-watcher — под профилем `chain`, как у Apex; platform-new.sh
#     включает его, когда задан адрес кошелька.

name: broker-cell-${CELL_SLUG:?нет CELL_SLUG — запускать через cell.sh}

x-site-db-url: &site_db_url postgres://broker:${SITE_DB_PASSWORD:?}@broker-db-site-${CELL_SLUG}:5432/broker_site
x-term-internal: &term_internal http://broker-terminal-gateway-${CELL_SLUG}:8080

services:
  # =====================================================================
  # БАЗЫ И ХРАНИЛИЩЕ
  # =====================================================================
  cell-site-db:
    image: postgres:16-alpine
    # `-db-` в имени — под фильтр бэкапа (`grep -E 'postgres|-db-'`).
    container_name: broker-db-site-${CELL_SLUG}
    restart: unless-stopped
    environment:
      POSTGRES_DB: broker_site
      POSTGRES_USER: broker
      POSTGRES_PASSWORD: ${SITE_DB_PASSWORD:?}
    volumes:
      - site-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U broker -d broker_site']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [inside]

  cell-term-db:
    image: postgres:16-alpine
    container_name: broker-db-terminal-${CELL_SLUG}
    restart: unless-stopped
    environment:
      POSTGRES_USER: terminal
      POSTGRES_PASSWORD: ${TERMINAL_DB_PASSWORD:?}
      POSTGRES_DB: terminal
    volumes:
      - term-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U terminal -d terminal']
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [inside]

  # KYC-хранилище ячейки. Своё, а не бакет в MinIO Apex: ПДн разных юрлиц не
  # лежат в одном хранилище с одним root-ключом (+≈220 МиБ, принято в проекте).
  # Образ и дайджест — те же, что у Apex. На `edge` — чтобы прокси отдал
  # оператору документы по имени files-хоста (за фильтром ADMIN_IP).
  cell-kyc-store:
    image: bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
    container_name: broker-minio-${CELL_SLUG}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET:?}
      MINIO_SCHEME: http
    volumes:
      - minio-data:/bitnami/minio/data
    networks: [inside, edge]

  # =====================================================================
  # ТЕРМИНАЛ ЯЧЕЙКИ (свой денежный журнал)
  # =====================================================================
  cell-term-gateway:
    image: ghcr.io/myxace/broker-terminal-gateway:${TERMINAL_REVISION:?нет ревизии терминала — запускать через cell.sh}
    container_name: broker-terminal-gateway-${CELL_SLUG}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://terminal:${TERMINAL_DB_PASSWORD}@broker-db-terminal-${CELL_SLUG}:5432/terminal
      SSO_DISABLED: '0'
      # JWKS — у кабинета ЭТОЙ ячейки. Один JWKS на шлюз — поэтому и шлюз на
      # ячейку (общий терминал на две платформы требует правки Rust).
      CABINET_URL: https://${CABINET_HOST:?}
      BUS_URL: amqp://${BUS_TERMINAL_USER:?}:${BUS_TERMINAL_PASSWORD:?}@${HUB_BUS:?}:5672/${BUS_VHOST:?}
      BUS_EXCHANGE: platform.events
      DEMO_START_BALANCE_CENTS: '${DEMO_START_BALANCE_CENTS:?}'
      MARGIN_CALL_LEVEL_PERCENT: '${MARGIN_CALL_LEVEL_PERCENT:?}'
      MARGIN_STOP_OUT_LEVEL_PERCENT: '${MARGIN_STOP_OUT_LEVEL_PERCENT:?}'
      NEGATIVE_BALANCE_PROTECTION: '${NEGATIVE_BALANCE_PROTECTION:?}'
      INTERNAL_MONEY_TOKEN: ${INTERNAL_MONEY_TOKEN:?}
      PLATFORM_LEVERAGE: '${PLATFORM_LEVERAGE:?}'
      REAL_TRADING_ENABLED: '${REAL_TRADING_ENABLED:?}'
      BUS_REAL_ACCOUNT_EVENTS: '1'
      CMS_BASE_URL: http://${HUB_CMS:?}:3001/v1
      CMS_API_KEY: ${CMS_API_KEY:?нет общего CMS_API_KEY хаба}
    depends_on:
      cell-term-db:
        condition: service_healthy
    networks:
      inside:
        # nginx образа терминала зовёт `gateway:8080` — имя зашито в образ.
        # Алиас ТОЛЬКО во внутренней сети ячейки (см. шапку).
        aliases: [gateway]
      back: {}

  cell-term-web:
    image: ghcr.io/myxace/broker-terminal-web:${TERMINAL_REVISION}
    container_name: broker-terminal-web-${CELL_SLUG}
    restart: unless-stopped
    environment:
      FRAME_ANCESTORS: https://${CABINET_HOST}
      BRAND_URL: ''
      CABINET_ORIGIN: https://${CABINET_HOST}
    depends_on:
      - cell-term-gateway
    # НЕ в `back`: там алиас `gateway` у шлюза Apex. Кабинет ячейки читает
    # историю сделок через `inside` (они в одном проекте).
    networks: [inside, edge]

  # =====================================================================
  # САЙТ ЯЧЕЙКИ
  # =====================================================================
  cell-web:
    image: ghcr.io/myxace/broker-web:${SITE_REVISION:?нет ревизии сайта — запускать через cell.sh}
    container_name: broker-web-${CELL_SLUG}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SITE_URL: https://${SITE_HOST:?}
      NEXT_PUBLIC_CABINET_URL: https://${CABINET_HOST}
      NEXT_PUBLIC_TERMINAL_URL: https://${TERMINAL_HOST:?}
      NEXT_PUBLIC_WS_URL: https://${SITE_HOST}
      DATABASE_URL: *site_db_url
      SITE_SLUG: ${CELL_SLUG}
      CMS_WEBHOOK_SECRET: ${CMS_WEBHOOK_SECRET:?}
      PREVIEW_SECRET: ${PREVIEW_SECRET:?нет общего PREVIEW_SECRET хаба}
      CMS_API_URL: http://${HUB_CMS}:3001/v1
      CMS_API_KEY: ${CMS_API_KEY}
      MDS_HTTP_URL: http://${HUB_MDS:?}:3003
    depends_on:
      cell-site-db:
        condition: service_healthy
    networks: [inside, edge, back]

  cell-cabinet:
    image: ghcr.io/myxace/broker-cabinet:${SITE_REVISION}
    container_name: broker-cabinet-${CELL_SLUG}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SITE_URL: https://${SITE_HOST}
      NEXT_PUBLIC_CABINET_URL: https://${CABINET_HOST}
      NEXT_PUBLIC_TERMINAL_URL: https://${TERMINAL_HOST}
      NEXT_PUBLIC_WS_URL: https://${SITE_HOST}
      DATABASE_URL: *site_db_url
      SITE_SLUG: ${CELL_SLUG}
      TERMINAL_INTERNAL_URL: *term_internal
      INTERNAL_MONEY_TOKEN: ${INTERNAL_MONEY_TOKEN}
      EXCHANGE_TRON_ADDRESS: ${EXCHANGE_TRON_ADDRESS:-}
      UPLOAD_DIR: /app/uploads
      MDS_HTTP_URL: http://${HUB_MDS}:3003
      CMS_API_URL: http://${HUB_CMS}:3001/v1
      CMS_API_KEY: ${CMS_API_KEY}
      TERMINAL_HTTP_URL: http://broker-terminal-web-${CELL_SLUG}
      SSO_PRIVATE_KEY_B64: ${SSO_PRIVATE_KEY_B64:?}
      S3_ENDPOINT: http://broker-minio-${CELL_SLUG}:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET}
      S3_FORCE_PATH_STYLE: 'true'
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
    depends_on:
      cell-site-db:
        condition: service_healthy
    volumes:
      - cabinet-uploads:/app/uploads
    networks: [inside, edge, back]

  cell-relay:
    image: ghcr.io/myxace/broker-relay:${SITE_REVISION}
    container_name: broker-relay-${CELL_SLUG}
    restart: unless-stopped
    environment:
      DATABASE_URL: *site_db_url
      BUS_URL: amqp://${BUS_SITE_WEB_USER:?}:${BUS_SITE_WEB_PASSWORD:?}@${HUB_BUS}:5672/${BUS_VHOST}
      BUS_EXCHANGE: platform.events
    depends_on:
      cell-site-db:
        condition: service_healthy
    networks: [inside, back]

  cell-consumer:
    image: ghcr.io/myxace/broker-consumer:${SITE_REVISION}
    container_name: broker-consumer-${CELL_SLUG}
    restart: unless-stopped
    environment:
      DATABASE_URL: *site_db_url
      SITE_SLUG: ${CELL_SLUG}
      BUS_URL: amqp://${BUS_CABINET_USER:?}:${BUS_CABINET_PASSWORD:?}@${HUB_BUS}:5672/${BUS_VHOST}
      BUS_EXCHANGE: platform.events
      # Очередь — умолчание кода (`cabinet.terminal-projection`), но в СВОЁМ
      # vhost ячейки: имя то же, очередь другая. Задано явно, чтобы было видно.
      BUS_QUEUE: cabinet.terminal-projection
      BUS_BINDING_KEY: terminal.#
    depends_on:
      cell-site-db:
        condition: service_healthy
    networks: [inside, back]

  cell-admin:
    image: ghcr.io/myxace/broker-admin:${SITE_REVISION}
    container_name: broker-admin-${CELL_SLUG}
    restart: unless-stopped
    environment:
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?}
      # Адрес для БРАУЗЕРА оператора (presigned-ссылки на документы KYC):
      # files-хост ячейки за фильтром источника в прокси.
      S3_ENDPOINT: https://${FILES_HOST:?}
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET}
      S3_FORCE_PATH_STYLE: 'true'
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      DATABASE_URL: *site_db_url
      TERMINAL_INTERNAL_URL: *term_internal
      INTERNAL_MONEY_TOKEN: ${INTERNAL_MONEY_TOKEN}
      EXCHANGE_TRON_ADDRESS: ${EXCHANGE_TRON_ADDRESS:-}
      SITE_SLUG: ${CELL_SLUG}
    depends_on:
      cell-site-db:
        condition: service_healthy
    # Без `back`: шлюз своей ячейки — по `inside`, CMS и шина админке не нужны.
    networks: [inside, edge]

  # Наблюдатель TRON: ключей нет, кошелёк только наблюдается. Профиль `chain`,
  # как у Apex: без адреса кошелька сервис fail-closed и не стартует.
  cell-chain-watcher:
    image: ghcr.io/myxace/broker-chain-watcher:${SITE_REVISION}
    container_name: broker-chain-watcher-${CELL_SLUG}
    restart: unless-stopped
    profiles: [chain]
    environment:
      DATABASE_URL: *site_db_url
      SITE_SLUG: ${CELL_SLUG}
      EXCHANGE_TRON_ADDRESS: ${EXCHANGE_TRON_ADDRESS:-}
      TERMINAL_INTERNAL_URL: *term_internal
      INTERNAL_MONEY_TOKEN: ${INTERNAL_MONEY_TOKEN}
      TRONGRID_API_KEY: ${TRONGRID_API_KEY:-}
      POLL_INTERVAL_MS: '15000'
    depends_on:
      cell-site-db:
        condition: service_healthy
    # В `back` не нужен: шлюз ячейки достижим по `inside`. Наружу (TronGrid)
    # выходит через NAT внутренней сети.
    networks: [inside]

networks:
  inside:
    driver: bridge
  edge:
    external: true
    name: ${EDGE_NET:?}
  back:
    external: true
    name: ${BACK_NET:?}

volumes:
  site-db-data:
  term-db-data:
  cabinet-uploads:
  minio-data:
