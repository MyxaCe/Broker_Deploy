# Параметры ХАБА, на котором живут ячейки. Секретов здесь нет — только имена
# контейнеров, сетей и пути к файлам, где секреты уже лежат (600, на хосте).
#
# Значения ниже = стенд 199.195.197.126 (снято чтением 10.11.2026). Для
# локальной проверки подставляется свой файл: CELLS_HUB_CONF=/путь/hub.conf.

# Корень стенда и публичный адрес хоста (с ним сверяется DNS ячейки).
HUB_ROOT=/srv/broker
PUBLIC_IP=199.195.197.126

# Общие docker-сети хаба (заводятся до подъёма стеков, external).
EDGE_NET=broker-edge
BACK_NET=broker-back

# Имена контейнеров хаба: ячейка ходит к ним по этим именам изнутри сети.
HUB_CMS=broker-cms
HUB_MDS=broker-mds
HUB_BUS=broker-bus
HUB_PROXY=broker-proxy

# Где лежат секреты хаба, которые ячейка ЧИТАЕТ, но не копирует.
#   site/.env   — общие ключи: CMS_API_KEY, PREVIEW_SECRET, TRONGRID_API_KEY
#   bus/.env    — BUS_ADMIN_USER / BUS_ADMIN_PASSWORD (завести vhost и кредлы)
#   cms/.env    — SEED_ADMIN_EMAIL / SEED_ADMIN_PASSWORD (REST CMS: сайт и контент)
#   proxy/      — Caddyfile + sites/ (фрагменты ячеек), .env (DOMAIN, ADMIN_IP)
HUB_SITE_ENV=/srv/broker/site/.env
HUB_BUS_ENV=/srv/broker/bus/.env
HUB_CMS_ENV=/srv/broker/cms/.env
PROXY_DIR=/srv/broker/proxy

# Ревизии образов хаба: новая ячейка СНИМАЕТ С НИХ КОПИЮ при создании и
# дальше живёт своей (`cells/<slug>/.revision*`) — Apex обновился, ячейка
# нет, пока её не обновили явно. Канареечный выкат даром.
HUB_SITE_REVISION_FILE=/srv/broker/site/.revision
HUB_TERMINAL_REVISION_FILE=/srv/broker/terminal/.revision

# Шаблонный сайт CMS, с которого копируется контент новой платформы.
TEMPLATE_SITE=apex-ru

# Кто пускается в админку ячейки. У Apex админка закрыта УЖЕ, чем CMS
# (три адреса, а не весь ADMIN_IP) — повторяем то же. Пусто — общий ADMIN_IP.
CELL_ADMIN_ALLOW="2.58.66.92 93.171.138.87 176.105.201.217"

# Образ с python3 для скрипта копирования CMS (уже есть на стенде).
PYTHON_IMAGE=python:3.12-slim

# Проверки.
DNS_CHECK=1          # 0 — пропустить сверку DNS (только локальная проверка!)
CERT_CHECK=1         # 0 — не ждать сертификатов (локально: внутренний CA)
CERT_WAIT_SEC=180
MIN_FREE_MB=1200     # ячейка ≈ 700 МиБ по docker stats + запас

# Где лежат экземпляры ячеек (<slug>/platform.conf, .env, compose.yml…).
CELLS_HOME=/srv/broker/cells
