name: broker-bus

services:
  rabbit:
    image: rabbitmq:3.13-management-alpine
    container_name: broker-bus
    restart: unless-stopped
    hostname: broker-bus
    environment:
      RABBITMQ_DEFAULT_USER: ${BUS_ADMIN_USER}
      RABBITMQ_DEFAULT_PASS: ${BUS_ADMIN_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: platform
    volumes:
      - data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_running']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks: [back]

networks:
  back:
    external: true
    name: broker-back

volumes:
  data:
