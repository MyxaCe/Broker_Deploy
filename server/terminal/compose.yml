# Терминал на сервере · OPS-24, этап 2.
#
# ОБРАЗЫ ТОЛЬКО ИЗ РЕЕСТРА, ПО ХЕШУ КОММИТА. Ни одного `build:` в этом файле —
# сборка на сервере отменена OPS-23, и если она вернётся сюда, задача потеряет
# смысл целиком.
#
# ПОРТЫ НАРУЖУ НЕ ПУБЛИКУЮТСЯ ВОВСЕ. Ни одного `ports:`. Снаружи доступен один
# прокси, он ходит в `web` по внутренней сети `broker-edge`. Заслон
# `broker-docker-firewall` это и так перехватил бы, но полагаться на заслон
# вместо правильной настройки — то же, что полагаться на прочитанную записку.
#
# РЕЖИМ — STANDALONE, И ЭТО ТРИ СОГЛАСОВАННЫЕ ПЕРЕМЕННЫЕ, А НЕ ОДНА.
# Правило платформы: режим, управляемый несколькими переменными, чинится
# целиком или не чинится.
#   SSO_DISABLED=1   у шлюза  — торговые ручки открыты без сессии кабинета;
#   CABINET_ORIGIN=""  у фронта — пусто, иначе фронт уходит в embedded-режим
#                      и торговые ручки не дёргает ВОВСЕ, даже при открытом
#                      шлюзе. Это и есть «конфигурация, выглядящая исправной»;
#   BRAND_URL=""       у фронта — заданный адрес без живой CMS даёт ошибку в
#                      консоли на каждой загрузке.
# Кабинет и CMS сегодня не развёрнуты, поэтому все три держим в одном режиме.

name: broker-terminal

services:
  db:
    image: postgres:16-alpine
    # ИМЯ ВЫБРАНО ПОД ФИЛЬТР БЭКАПА. `backup.sh` ищет контейнеры по
    # `grep -E 'postgres|-db-'` ПО ИМЕНИ. `broker-terminal-db` под этот фильтр
    # НЕ попал бы — «db» на конце, без замыкающего дефиса, — и база молча не
    # попала бы в снимок. Имя здесь не косметика.
    container_name: broker-db-terminal
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TERMINAL_DB_USER}
      POSTGRES_PASSWORD: ${TERMINAL_DB_PASSWORD}
      POSTGRES_DB: ${TERMINAL_DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Шлюз поднимается только когда база реально принимает подключения:
      # иначе он упадёт на восстановлении состояния, а работать на неизвестном
      # состоянии счетов нельзя.
      test: ['CMD-SHELL', 'pg_isready -U ${TERMINAL_DB_USER} -d ${TERMINAL_DB_NAME}']
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [inside]

  gateway:
    # Ревизия — в файле `.revision` рядом, одна строка на весь стек.
    image: ghcr.io/myxace/broker-terminal-gateway:${TERMINAL_REVISION}
    container_name: broker-terminal-gateway
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${TERMINAL_DB_USER}:${TERMINAL_DB_PASSWORD}@db:5432/${TERMINAL_DB_NAME}
      # Задан DATABASE_URL → PgStore. Без него состояние живёт в памяти и
      # исчезает при рестарте, а интерфейс от режима с базой неотличим
      # (КОНТРАКТЫ §5в). Здесь он задан намеренно.
      # SSO ВКЛЮЧЁН (OPS-34). До 24.10 стоял «1», и следствие было прямое:
      # все запросы шли на ОДИН общий счёт, у которого нет внешней личности,
      # а событие адресуется парой «тенант + личность» — значит на шину не
      # уходило НИ ОДНОГО события, сколько бы сделок ни совершили.
      #
      # Включению предшествовала репетиция на отдельном стенде, а не чтение
      # настройки: кабинет выпустил токен, терминал обменял его на сессию,
      # торговые ручки под сессией отработали, без сессии дали 401, сделка
      # открылась и закрылась, чужой тенант отвергнут.
      #
      # ЦЕНА НАЗВАНА И ПРИНЯТА: публичный терминал без сессии теряет баланс
      # и торговлю, оставаясь графиком. Взамен каждый вход из кабинета
      # получает СВОЙ счёт — общий демо-счёт, в котором двое видели сделки
      # друг друга, этим и закрывается.
      SSO_DISABLED: '0'
      # Адрес кабинета, откуда шлюз берёт JWKS для проверки handoff-JWT.
      # СЕГОДНЯ ИНЕРТЕН: при SSO_DISABLED=1 шлюз сессий не спрашивает.
      # Задан, чтобы включение режима было правкой ОДНОЙ переменной, а не
      # поиском второй — режим, управляемый несколькими переменными,
      # чинится целиком или не чинится.
      CABINET_URL: https://cabinet.${DOMAIN}
      # ШИНА (TRM-40). Кредл издателя: `write` только на platform.events,
      # `configure` пуст — обменник терминал объявляет пассивно, а право
      # его пересоздать позволило бы подменить топологию под чужим
      # потребителем. Пароль лежит у шины и читается оттуда.
      #
      # БЕЗ BUS_URL события НЕ ТЕРЯЮТСЯ, а копятся в исходящей очереди —
      # так устроено сознательно, и число ждущих видно в /health
      # (`outbox_pending`). Это не заглушка ради зелёного.
      BUS_URL: amqp://terminal:${BUS_TERMINAL_PASSWORD}@broker-bus:5672/platform
      BUS_EXCHANGE: platform.events
      DEMO_START_BALANCE_CENTS: '1000000'
      # ПОРОГИ МАРЖИ. Без них закрытия и предупреждения НЕТ ВОВСЕ, и шлюз
      # кричит об этом двумя строками в лог: умолчания в коде нет
      # сознательно — порог задаёт юрисдикция, и выдумывать его в коде
      # нельзя. Значения названы штабом (маржин-колл 100 %, закрытие 50 %)
      # и совпадают с тем, что реализовала зона терминала.
      #
      # Две переменные, а не одна, и обе обязательны: закрытие без
      # предупреждения — это срабатывание без шанса отреагировать.
      MARGIN_CALL_LEVEL_PERCENT: '100'
      MARGIN_STOP_OUT_LEVEL_PERCENT: '50'
      # NEGATIVE_BALANCE_PROTECTION НЕ ЗАДАНА СОЗНАТЕЛЬНО. Умолчание —
      # выключено, и это замысел: защита не требуется юрисдикцией, мы
      # давали бы её по своему выбору, а доплачивать за клиента «само
      # собой» нельзя. Включение — решение владельца, не деплоя.
      # ИСТОЧНИК ALLOW-LIST — CMS (OPS-28). Сервер-сервер, по внутренней
      # сети: `GET {CMS_BASE_URL}/cms/sites/{slug}` под `X-API-Key`.
      #
      # До 24.10 все три переменные были пусты, и в комментарии здесь
      # стояло, что тогда «тенантного режима нет». ЭТО БЫЛО НЕВЕРНО, и
      # наблюдение это опровергло: тенантный режим включает `?site=` В
      # АДРЕСЕ, который ставит кабинет, а не наличие источника. Без
      # источника встроенный терминал отдавал `503` на `/instruments` —
      # правильный fail-closed по КОНТРАКТЫ §4б, но наполнение списка
      # владельцем до терминала не дошло бы ВООБЩЕ.
      #
      # Нужны ОБЕ переменные: по одной шлюз честно печатает «CMS
      # сконфигурирована наполовину» и источник не использует.
      CMS_BASE_URL: http://broker-cms:3001/v1
      CMS_API_KEY: ${CMS_API_KEY}
      # TENANT_INSTRUMENTS не задан: это запасной источник списка файлом, и
      # при живой CMS он был бы вторым источником правды.
    depends_on:
      db:
        condition: service_healthy
    # `back` — чтобы шлюз дотянулся до CMS за allow-list, не выходя наружу.
    networks: [inside, back]

  web:
    image: ghcr.io/myxace/broker-terminal-web:${TERMINAL_REVISION}
    container_name: broker-terminal-web
    restart: unless-stopped
    environment:
      # Кто имеет право встраивать терминал в iframe. С выкаткой кабинета
      # (OPS-25) список перестал быть пустым: это первая из шести
      # производных строк КОНТРАКТЫ §6, и ведётся она руками. Витрина
      # терминал не встраивает и сюда не входит. Образ по умолчанию
      # несёт `*` — открыто всем; значение здесь обязательно.
      FRAME_ANCESTORS: https://cabinet.${DOMAIN}
      # С 24.10 ЭТИ ДВЕ ПЕРЕМЕННЫЕ ДЕЙСТВУЮТ: скрипт рендера настроек
      # получил бит исполнения (`COPY --chmod=0755`, B-OPS-016), и
      # `/config.js` отдаёт конфигурацию, а не index.html.
      #
      # ЗАДАННЫЙ `CABINET_ORIGIN` ПЕРЕВОДИТ ФРОНТ В EMBEDDED-РЕЖИМ, и это
      # мина, названная заранее: `tradingBlocked()` в api.js — это
      # `embedded && !Sso.token()`. Для посетителя публичного терминала
      # токена нет, значит торговые ручки он не дёргает ВООБЩЕ — не
      # получает 401, а молчит. Вместе с включённым SSO это согласованная
      # пара: сервер отказал бы всё равно, и фронт просто перестаёт
      # спрашивать вместо того, чтобы шуметь в консоль.
      #
      # BRAND_URL оставлен пустым: заданный адрес без живой выдачи бренда
      # даёт ошибку в консоли на каждой загрузке.
      BRAND_URL: ''
      CABINET_ORIGIN: https://cabinet.${DOMAIN}
    depends_on:
      - gateway
    networks:
      # `inside` нужна, чтобы nginx дотянулся до `gateway:8080` — адрес зашит
      # в nginx.conf образа. `edge` — чтобы до самого nginx дотянулся прокси.
      # `back` — чтобы кабинет читал историю сделок изнутри, не выходя
      # наружу и обратно через прокси (CAB-09).
      - inside
      - edge
      - back

networks:
  inside:
    # Внутренняя сеть стека. Алиас `gateway` живёт только здесь и не
    # сталкивается с чужими службами на общих сетях.
    driver: bridge
  edge:
    external: true
    name: broker-edge
  back:
    external: true
    name: broker-back

volumes:
  pgdata:
