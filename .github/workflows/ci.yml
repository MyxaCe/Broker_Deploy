name: CI

# ТРИГГЕР: пуш в ЛЮБУЮ ветку.
#
# В зоне `deploy` каталога .github не существовало вовсе — ни одного прогона с
# заведения репозитория 05.10. Задача OPS-14 была закрыта 06.10 формулировкой
# «CI на пуш в любую ветку», и формулировка оказалась шире сделанного: правка
# была внесена в ОДИН репозиторий из пяти (Р-077, разбор в ЗАДАЧИ.md OPS-18).
#
# Цена двойного прогона на ветке с открытым PR принята сознательно, как у
# соседей: пропущенный прогон уже стоил нам месяца красного смоука, лишний не
# стоит ничего.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Зависимости ОБЪЯВЛЕНЫ, а не предположены. shellcheck и pyyaml на
      # образе раннера сегодня есть, но «сегодня есть» — это свойство образа,
      # а не нашего прогона: в день, когда его уберут, проверка молча
      # перестанет выполняться. Оба наших скрипта при отсутствии инструмента
      # падают с «проверка НЕ ВЫПОЛНЕНА» — установка здесь нужна, чтобы этого
      # отказа не случалось по недосмотру.
      - name: Установить инструменты проверок
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          python3 -m pip install --quiet pyyaml
          shellcheck --version | head -2
          python3 -c 'import yaml; print("pyyaml", yaml.__version__)'

      # --- 1. Код проверок проверяется (QA-03) ---------------------------
      # Зона состоит из shell целиком, и до 19.10 над ним не стояло ничего.
      # Первый прогон нашёл два настоящих дефекта в коде, печатающем вердикт
      # (B-OPS-010, B-OPS-011).
      - name: shellcheck над всеми скриптами зоны
        run: bash ci/shellcheck.sh

      # --- 2. Надстройка компоуза ----------------------------------------
      # ЧАСТИЧНАЯ проверка, и она сама об этом говорит: база компоуза лежит в
      # репозитории site-platform, и контур целиком отсюда не собирается.
      - name: Разбор надстройки компоуза и порты контура
        run: bash ci/compose-overlay-check.sh

      # --- 3. Охват бэкапа ------------------------------------------------
      # Мутация «зона появилась, а в списках её нет», которую в OPS-16 делали
      # рукой, переписана механикой: два синтетических корня и разница между
      # ними. Зелёный путь «бэкап полон» здесь НЕ проверяется — для него
      # нужен живой контур, и это сказано в выводе самого прогона.
      - name: Охват бэкапа на синтетических корнях
        run: bash ci/backup-coverage-test.sh

      # --- 4. Охват наблюдения ---------------------------------------
      # Порог тревоги об охвате — число, вбитое в правило руками. Руками
      # веденное число отстаёт от файла молча и ровно в ту сторону, в
      # какую файл растёт. Сверяем механизмом.
      - name: Объявленный охват правил совпадает с действительным
        run: bash ci/ohvat-pravil.sh

      # --- 5. Примонтированный каталог не удаляют --------------------
      # Запрет был написан комментарием рядом с местом соблазна, и этого
      # хватило ровно до следующего раза. Комментарий обращён к тому, кто
      # читает; удаляет тот, кто спешит.
      #
      # Сторож различает УПОМИНАНИЕ и УПОТРЕБЛЕНИЕ: предупреждение,
      # называющее `rm -rf`, обязано проходить, иначе оно безымянное.
      # Обе стороны показаны отдельным стендом — он идёт первым, потому
      # что сторож, чьё умение краснеть не показано, ничего не стоит.
      - name: Стенд сторожа примонтированного — обе стороны
        run: bash ci/ohrana-montirovannogo-test.sh

      - name: Примонтированный каталог не удаляют
        run: python3 ci/ohrana-montirovannogo.py

      # --- 6. Настоящих адресов в репозитории нет ---------------------
      # Репозиторий публичный, и за двое суток я дважды унёс в него то,
      # чему там не место. Оба раза поймала дисциплина — я сам, перед
      # пушем. Дисциплина ловит, пока смотрит; механизм появился только
      # после двух случаев, и это стоит назвать вслух.
      - name: Настоящих сетевых адресов в репозитории нет
        run: bash ci/net-adresov.sh

      # ЧЕГО В ЭТОМ ПРОГОНЕ НЕТ, И ЭТО НЕ ЗАБЫТО:
      #
      #  * `verify-restore.sh` целиком — ему нужны живые базы и тома контура.
      #    Запускается на машине с контуром, вручную, после `backup.sh`.
      #  * `docker compose config` всего контура — база в чужом репозитории.
      #  * `bus-setup.sh` — ему нужен поднятый RabbitMQ.
      #
      # Все три прогоняются на машине владельца и записываются в ЗАДАЧИ.md
      # разделом «чем проверено». Подменять их здесь зелёной галочкой нельзя:
      # пустой зелёный хуже отсутствующего.
