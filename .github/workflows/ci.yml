name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Установить инструменты проверок
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          python3 -m pip install --quiet pyyaml
          shellcheck --version | head -2
          python3 -c 'import yaml; print("pyyaml", yaml.__version__)'

      - name: shellcheck над всеми скриптами зоны
        run: bash ci/shellcheck.sh

      - name: Разбор надстройки компоуза и порты контура
        run: bash ci/compose-overlay-check.sh

      - name: Охват бэкапа на синтетических корнях
        run: bash ci/backup-coverage-test.sh
